<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Mi Perfil</h1>
        <nav>
            <ul>
                <li><a href="index.html">Dashboard Principal</a></li>
                <li><a href="proyectos.html">Explorador de Proyectos</a></li>
                <li><a href="detalle.html">Detalle de Proyecto</a></li>
                <li><a href="perfil.html">Perfil de Usuario</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Información de Perfil</h2>
            <figure>
                <img src="images/usuario.png" alt="Foto de perfil" width="150">
                <figcaption>Usuario: nombre_usuario</figcaption>
            </figure>
            <form action="#" method="post">
                <fieldset>
                    <legend>Datos Personales</legend>
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" name="nombre" id="nombre" value="Nombre Usuario" required><br>

                    <label for="email">Correo Institucional:</label>
                    <input type="email" name="email" id="email" value="nombre_usuario@fi.unju.edu.ar" required>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
